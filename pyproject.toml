[tool.briefcase]
project_name = "NewGAN Manager"
bundle = "com.fm"
version = "1.4.2"
url = "https://github.com/huangzhanhao/NewGAN-Manager-ByHzH"
license = "GNU General Public License v3 (GPLv3)"
author = 'Maradonna (gestalt)'
author_email = "None"

[tool.briefcase.app.newganmanager]
formal_name = "NewGAN Manager"
description = "NewGAN Replacement Management Tool"
icon = "src/newganmanager/resources/newganmanager"
sources = ['src/newganmanager']
module_name = "newganmanager"
requires = [
    "toga>=0.5.2",
    "toga-core>=0.5.2",
    "dhooks==1.1.4",
    "requests==2.32.5",
    "packaging>=25.0",
    "travertino>=0.5.2"
]

[tool.briefcase.app.newganmanager.macOS]
requires = [
    'toga-cocoa>=0.5.2',
    'rubicon-objc>=0.5.2',
]

[tool.briefcase.app.newganmanager.linux]
requires = [
    'toga-gtk>=0.5.2',
]
system_requires = [
    'libgirepository1.0-dev',
    'libcairo2-dev',
    'libpango1.0-dev',
    'libwebkitgtk-3.0-0',
    'gir1.2-webkit-3.0',
]

[tool.briefcase.app.newganmanager.windows]
requires = [
    'toga-winforms>=0.5.2',
]

## Mobile deployments
[tool.briefcase.app.newganmanager.iOS]
requires = [
    'toga-iOS>=0.5.2',
]

[tool.briefcase.app.newganmanager.android]
requires = [
    'toga-android>=0.5.2',
]