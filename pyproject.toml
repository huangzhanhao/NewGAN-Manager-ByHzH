[build-system]
requires = ["briefcase"]
build-backend = "briefcase.appmeta"

[project]
name = "newganmanager"
version = "1.4.4"
description = "Football Manager NewGAN Replacement Tool"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "huangzhanhao"},
]
dependencies = [
    "toga>=0.5.2",
    "requests>=2.32.5",
    "dhooks>=1.1.4",
]

[project.urls]
Homepage = "https://github.com/huangzhanhao/NewGAN-Manager-ByHzH"

[tool.briefcase]
project_name = "NewGAN-Manager"
bundle = "com.fm"

[tool.briefcase.app.newganmanager]
formal_name = "NewGAN Manager"
description = "Football Manager NewGAN Replacement Tool"
icon = "src/newganmanager/resources/favicon.ico"
sources = ['src/newganmanager']
requires = [
    "toga>=0.5.2",
    "requests>=2.32.5",
    "dhooks>=1.1.4",
]

[tool.briefcase.app.newganmanager.macOS]
requires = [
    'toga-cocoa>=0.5.2',
    'rubicon-objc>=0.5.2',
]

[tool.briefcase.app.newganmanager.linux]
requires = [
    'toga-gtk>=0.5.2',
]
system_requires = [
    'libgirepository1.0-dev',
    'libcairo2-dev',
    'libpango1.0-dev',
    'libwebkitgtk-3.0-0',
    'gir1.2-webkit-3.0',
]

[tool.briefcase.app.newganmanager.windows]
requires = [
    'toga-winforms>=0.5.2',
]

[tool.briefcase.app.newganmanager.iOS]
requires = [
    'toga-iOS>=0.5.2',
]

[tool.briefcase.app.newganmanager.android]
requires = [
    'toga-android>=0.5.2',
]
