name: Linux

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies (toga-gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libgtk-3-dev
      - name: Install Python dependencies
        run: python -m pip install toga requests dhooks
      - name: Run tests
        run: python -m unittest discover -s src/tests -p "test*.py" -v

  build:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Briefcase
        run: python -m pip install briefcase
      - name: Build (AppImage via Docker backend)
        run: |
          briefcase create
          briefcase build
