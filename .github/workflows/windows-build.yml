name: Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install dependencies
        run: python -m pip install toga requests dhooks
      - name: Run tests
        run: python -m unittest discover -s src/tests -p "test*.py" -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install Briefcase
        run: python -m pip install briefcase
      - name: Build
        run: |
          briefcase create
          briefcase build
          briefcase package
      - name: Save Installer
        uses: actions/upload-artifact@v4
        with:
          name: NewGAN-Manager-Installer-Win
          path: dist/*.msi
          if-no-files-found: error
